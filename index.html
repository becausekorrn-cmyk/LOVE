<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ты хочешь это увидеть?</title>
  <style>
    :root { --mud:#4b321f; --mud-dark:#24180f; --mud-light:#76502e; --cream:#f3dfbd; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: var(--cream); font-family: Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #80603a 0, #4b321f 38%, #20150e 100%);
      overflow-x: hidden;
    }
    .panel {
      width: min(620px, 100%); text-align: center; padding: 38px 26px;
      border: 2px solid #a17a4d; border-radius: 26px;
      background: linear-gradient(145deg, rgba(75,50,31,.96), rgba(35,23,14,.98));
      box-shadow: 0 22px 70px #100a06aa, inset 0 1px 0 #d5b17a44;
    }
    .eyebrow { color: #d1ad7b; letter-spacing: .18em; font-size: 11px; text-transform: uppercase; }
    h1 { margin: 14px 0 12px; font-size: clamp(26px, 6vw, 40px); }
    p { color: #ddc6a2; line-height: 1.5; }
    button {
      border: 1px solid #d0a46c; border-radius: 999px; padding: 15px 48px;
      margin-top: 20px; color: #2a1a0d; font-weight: 900; font-size: 18px;
      background: linear-gradient(#e0bd86, #a87945); cursor: pointer;
      box-shadow: 0 7px 0 #5a3a20, 0 12px 25px #100a0680;
      transition: transform .15s, filter .15s;
    }
    button:hover { filter: brightness(1.12); transform: translateY(-2px); }
    button:active { transform: translateY(4px); box-shadow: 0 3px 0 #5a3a20; }
    .count { margin-top: 20px; color: #b9976a; font-size: 13px; }
    .progress { height: 7px; margin: 22px auto 0; max-width: 300px; border-radius: 9px; background: #24180f; overflow: hidden; }
    .bar { height: 100%; width: 0%; background: #c69b64; transition: width .25s; }
    #reveal { display: none; }
    #reveal img { display: block; width: min(360px, 100%); max-height: 360px; object-fit: contain; margin: 22px auto 0; border-radius: 18px; filter: drop-shadow(0 14px 18px #120b07aa); }
    .final-title { color: #e4c18e; }
    .tiny { font-size: 12px; color: #b9976a; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="panel">
    <section id="steps">
      <div class="eyebrow">секретная болотная процедура</div>
      <h1>Ты хочешь это увидеть?</h1>
      <p>Тут есть кое-что… очень необычное.</p>
      <button id="yesButton" type="button">Да</button>
      <div class="count" id="count">Шаг 1 из 15</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </section>

    <section id="reveal">
      <div class="eyebrow">поздравляем, ты дошёл до конца</div>
      <h1 class="final-title">ВОТ ОНО.</h1>
      <p>Легендарное болотное сокровище 🟤</p>
      <img src="poop.png" alt="Какашка" onerror="this.style.display='none'; document.getElementById('missing').style.display='block';">
      <p id="missing" class="tiny" style="display:none">Положи файл <b>poop.png</b> рядом с index.html, чтобы показать картинку.</p>
      <p class="tiny">Ты сам нажал «Да» целых 15 раз.</p>
      <button type="button" onclick="location.reload()">Пройти ещё раз</button>
    </section>
  </main>

  <audio id="finalSound" src="audio_2026-11-14_04-04-10.ogg" preload="auto"></audio>
  <script>
    let step = 1;
    const button = document.getElementById('yesButton');
    const count = document.getElementById('count');
    const bar = document.getElementById('bar');
    const audio = document.getElementById('finalSound');

    button.addEventListener('click', async () => {
      if (step < 15) {
        step++;
        count.textContent = `Шаг ${step} из 15`;
        bar.style.width = `${((step - 1) / 14) * 100}%`;
        // На каждом шаге вопрос остаётся тем же — меняется только номер.
      } else {
        document.getElementById('steps').style.display = 'none';
        document.getElementById('reveal').style.display = 'block';
        try {
          audio.currentTime = 0;
          await audio.play();
        } catch (err) {
          console.warn('Браузер не смог запустить звук:', err);
        }
      }
    });
  </script>
</body>
</html>
